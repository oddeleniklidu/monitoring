<section class="archive-hero" aria-labelledby="archive-title">
  <div class="hero-copy">
    <p class="eyebrow">Oddělení klidu / Veřejný archiv</p>
    <h1 id="archive-title">VYDŘIN <span>ARCHIV</span></h1>
    <p class="archive-motto">Internet zapomíná. Vydra ne.</p>
    <p class="hero-note">Šanony, dokumenty a záznamy změn internetového obsahu.</p>
  </div>
  <figure class="hero-visual">
    {% if site.archive_image %}
    <img src="{{ site.archive_image | relative_url }}" width="{{ site.archive_image_width | default: 1536 }}" height="{{ site.archive_image_height | default: 1024 }}" alt="{{ site.archive_image_alt | default: 'Vydra s lucernou ve starobylém archivu' | escape }}" fetchpriority="high">
    {% else %}
    <img src="{{ '/assets/images/postava-vydra-flegmatik.png' | relative_url }}" width="1050" height="1022" alt="Vydra se sluchátky u mikrofonu" fetchpriority="high">
    {% endif %}
    <figcaption><strong>VYDRA</strong><span>Správce archivu</span></figcaption>
  </figure>
</section>
<ul class="archive-sections" aria-label="Oddělení archivu">

</ul>
