name: Archiv — kontrola webu
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sestavení Jekyllu
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - name: Kontrola odkazů v sestaveném webu
        run: python3 scripts/check_site.py _site
      - name: Web k prohlédnutí
        uses: actions/upload-artifact@v4
        with:
          name: vydrin-archiv-preview
          path: _site
          retention-days: 7
