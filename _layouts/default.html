<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <link rel="icon" href="{{ '/assets/favicon.svg' | relative_url }}" type="image/svg+xml">
  <title>{{ page.title | escape }} · Vydřin archiv</title>
  <link rel="stylesheet" href="{{ '/assets/fonts/fonts.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/archive.css' | relative_url }}">
</head>
<body>
  <a class="skip-link" href="#obsah">Přejít na obsah</a>
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="/Sanony/"><span class="brand-mark" aria-hidden="true">OK</span><span>ODDĚLENÍ KLIDU<span class="brand-subtitle">Vydřin archiv</span></span></a>
      <nav aria-label="Hlavní navigace">
        <a href="/Sanony/#sanony"{% if site.baseurl == '/Sanony' %} aria-current="page"{% endif %}>Šanony</a>
        <a href="/monitoring/#monitoring"{% if site.baseurl == '/monitoring' %} aria-current="page"{% endif %}>Monitoring</a>
      </nav>
    </div>
  </header>
  <main id="obsah" tabindex="-1">
    {% if page.home %}{% include entrance.html %}{% endif %}
    <div class="document{% if page.wide %} document-wide{% endif %}{% if page.page_class %} {{ page.page_class | escape }}{% endif %}">{{ content }}</div>
  </main>
  <footer class="site-footer">
    <p><span class="footer-signature">Spravuje Vydra.</span><br>Oddělení klidu · Veřejný archiv</p>
    <p>Záznamy dokládají stav při kontrole.<br><a href="{{ site.repository_url }}">Podklady a historie úprav na GitHubu</a></p>
  </footer>
  {% if page.table_filter %}<script src="{{ '/assets/video-filter.js' | relative_url }}" defer></script>{% endif %}
</body>
</html>
