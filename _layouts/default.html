<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{ site.description | escape }}">
  <title>{{ page.title | escape }} · Oddělení klidu</title>
  <style>
    :root{color-scheme:light;--ink:#1d2e3c;--accent:#285d6b;--line:#d7e1e5;--paper:#fff;--ground:#f3f6f7}
    *{box-sizing:border-box}body{margin:0;background:var(--ground);color:var(--ink);font:17px/1.65 system-ui,sans-serif}
    a{color:var(--accent);text-underline-offset:3px}a:focus-visible{outline:3px solid #b66319;outline-offset:4px}
    header{background:#152c38;color:#fff}header>div,main,footer{max-width:1120px;margin:auto;padding:24px}
    header>div{display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap}header a{color:#fff}
    .brand{font-size:1.2rem;font-weight:750;text-decoration:none}nav{display:flex;gap:22px;flex-wrap:wrap}main{padding-top:42px;padding-bottom:56px;min-height:65vh}
    h1{font-size:clamp(2rem,5vw,3.2rem);line-height:1.15;letter-spacing:-.035em;margin:0 0 22px}h2{line-height:1.3;margin-top:32px}
    p{max-width:78ch}.intro{font-size:1.15rem;color:#4c6471}.cards{list-style:none;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,290px),1fr));gap:18px;margin-top:32px}
    .cards li{background:var(--paper);border:1px solid var(--line);border-radius:12px;overflow:hidden}.cards a{display:block;padding:24px;font-weight:650;text-decoration:none;height:100%}.cards a:hover{background:#eaf2f4}
    .notice{padding:18px 22px;background:#e7eff2;border-left:4px solid var(--accent);border-radius:4px}footer{border-top:1px solid var(--line);font-size:.9rem;color:#526674}
    table{border-collapse:collapse;display:block;overflow:auto}th,td{padding:9px 14px;border:1px solid var(--line)}th{background:#e7eff2}
    img{max-width:100%}pre{overflow:auto;background:#e7eff2;padding:16px}code{overflow-wrap:anywhere}li{margin:5px 0}
    @media(max-width:520px){header>div,main,footer{padding:20px}nav{gap:16px}.cards a{padding:20px}}
  </style>
</head>
<body>
  <header><div><a class="brand" href="{{ '/' | relative_url }}">Oddělení klidu · {{ site.title | escape }}</a><nav aria-label="Hlavní navigace"><a href="/Sanony/">Šanony</a><a href="/monitoring/">Monitoring</a><a href="{{ site.repository_url }}">GitHub</a></nav></div></header>
  <main id="obsah">{{ content }}</main>
  <footer>Oddělení klidu · {{ site.title | escape }} · <a href="{{ site.repository_url }}">Zdrojový repozitář</a></footer>
</body>
</html>
